<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALITEO Qualité de l'eau potable – France</title>

  <!-- Favicon goutte d'eau -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%230ea5e9' d='M32 4C32 4 12 28 12 40c0 11 9 20 20 20s20-9 20-20C52 28 32 4 32 4z'/%3E%3Cpath fill='%23bae6fd' d='M32 12c0 0-12 16-12 26 0 6.6 5.4 12 12 12s12-5.4 12-12C44 28 32 12 32 12z'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      z-index: 1000;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    .logo { width: 32px; height: 32px; }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
    }
    .sidebar {
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-box {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      background: #f1f5f9;
    }
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-row input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .search-row input[type="text"]:focus { border-color: var(--primary); }
    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-outline:hover { background: #e0f2fe; }
    .date-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .date-row label { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .date-row input[type="date"] {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: white;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
    }
    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .filter-btn.conforme.active { background: var(--success); border-color: var(--success); }
    .filter-btn.nonconforme.active { background: var(--danger); border-color: var(--danger); }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 14px;
      right: 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 2000;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      display: none;
    }
    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .suggestion-item:hover, .suggestion-item.active { background: #e0f2fe; }
    .commune-info {
      padding: 10px 14px;
      background: #f0f9ff;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.ko { background: #fee2e2; color: #991b1b; }
    .badge.unk { background: #f1f5f9; color: #475569; }
    .card-date { font-weight: 600; font-size: 14px; }
    .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .empty, .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    #map { height: 100%; width: 100%; }
    .detail-panel {
      position: fixed;
      top: 0; right: 0;
      width: 420px;
      max-width: 100%;
      height: 100%;
      background: white;
      box-shadow: -4px 0 24px rgba(0,0,0,.15);
      z-index: 3000;
      transform: translateX(100%);
      transition: transform .25s ease;
      display: flex;
      flex-direction: column;
    }
    .detail-panel.open { transform: translateX(0); }
    .detail-header {
      padding: 16px 20px;
      background: var(--primary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-header h2 { font-size: 1.1rem; }
    .close-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }
    .detail-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .detail-section { margin-bottom: 18px; }
    .detail-section h3 {
      font-size: 13px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: .03em;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 4000;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .marker-icon {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path fill="#bae6fd" d="M32 4C32 4 12 28 12 40c0 11 9 20 20 20s20-9 20-20C52 28 32 4 32 4z"/>
      <path fill="#fff" d="M32 12c0 0-12 16-12 26 0 6.6 5.4 12 12 12s12-5.4 12-12C44 28 32 12 32 12z"/>
    </svg>
    <h1>KALITEO Qualité de l'eau potable – France</h1>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="search-box" style="position:relative">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Commune, code postal…" autocomplete="off" />
          <button class="btn" id="btnSearch">Rechercher</button>
          <button class="btn btn-outline" id="btnGeo" title="Ma position">📍</button>
        </div>

        <div class="date-row">
          <label for="dateInput">Date cible :</label>
          <input type="date" id="dateInput" />
        </div>

        <div class="filters">
          <button class="filter-btn active" data-filter="all">Tous</button>
          <button class="filter-btn conforme" data-filter="conforme">Conformes</button>
          <button class="filter-btn nonconforme" data-filter="nonconforme">Non conformes</button>
        </div>

        <div class="suggestions" id="suggestions"></div>
      </div>

      <div class="commune-info" id="communeInfo">Cliquez sur la carte ou recherchez une commune</div>
      <div class="list" id="list">
        <div class="empty">Aucun prélèvement chargé</div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <h2 id="detailTitle">Détail du prélèvement</h2>
      <button class="close-btn" id="closeDetail">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== État global ==========
    let map, markersLayer;
    let currentCommune = null;
    let allPrelevements = [];
    let currentFilter = "all";
    let selectedDate = new Date().toISOString().slice(0, 10);

    // ========== Initialisation ==========
    document.getElementById("dateInput").value = selectedDate;

    map = L.map("map").setView([46.6, 2.4], 6);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles © Esri",
      maxZoom: 19
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);

    // Clic sur la carte → reverse geocode
    map.on("click", async (e) => {
      hideSuggestions();
      showToast("Recherche de la commune…");
      await searchByCoords(e.latlng.lat, e.latlng.lng);
    });

    // ========== Helpers ==========
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function hideSuggestions() {
      document.getElementById("suggestions").style.display = "none";
    }

    function isConforme(p) {
      const c = (p.conclusion || "").toLowerCase();
      if (c.includes("non conforme") || c.includes("non-conforme")) return false;
      if (c.includes("conforme")) return true;
      return null;
    }

    function jitter(lat, lon, index) {
      const angle = index * 2.399963;
      const r = 0.0018 + (index % 7) * 0.00035;
      return [lat + Math.cos(angle) * r, lon + Math.sin(angle) * r];
    }

    // ========== Autocomplete ==========
    let suggestTimer = null;
    const searchInput = document.getElementById("searchInput");
    const suggestionsEl = document.getElementById("suggestions");

    searchInput.addEventListener("input", () => {
      clearTimeout(suggestTimer);
      const q = searchInput.value.trim();
      if (q.length < 2) { hideSuggestions(); return; }
      suggestTimer = setTimeout(() => fetchSuggestions(q), 280);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideSuggestions();
    });

    async function fetchSuggestions(q) {
      try {
        const url = `https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(q)}&fields=nom,code,codesPostaux,centre&boost=population&limit=8`;
        const res = await fetch(url);
        const data = await res.json();
        renderSuggestions(data);
      } catch (e) {
        hideSuggestions();
      }
    }

    function renderSuggestions(list) {
      if (!list.length) { hideSuggestions(); return; }
      suggestionsEl.innerHTML = list.map(c => `
        <div class="suggestion-item" data-code="${c.code}" data-nom="${c.nom}" data-lat="${c.centre?.coordinates[1]}" data-lon="${c.centre?.coordinates[0]}">
          <strong>${c.nom}</strong> <span style="color:#64748b">(${(c.codesPostaux||[])[0] || c.code})</span>
        </div>
      `).join("");
      suggestionsEl.style.display = "block";
      suggestionsEl.querySelectorAll(".suggestion-item").forEach(el => {
        el.addEventListener("click", () => {
          searchInput.value = el.dataset.nom;
          hideSuggestions();
          loadCommune({
            code: el.dataset.code,
            nom: el.dataset.nom,
            lat: parseFloat(el.dataset.lat),
            lon: parseFloat(el.dataset.lon)
          });
        });
      });
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) hideSuggestions();
    });

    // ========== Recherche ==========
    document.getElementById("btnSearch").addEventListener("click", () => {
      const q = searchInput.value.trim();
      if (q) doTextSearch(q);
    });
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        const q = searchInput.value.trim();
        if (q) doTextSearch(q);
      }
    });

    async function doTextSearch(q) {
      hideSuggestions();
      try {
        const url = `https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(q)}&fields=nom,code,centre&boost=population&limit=1`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.length) {
          const c = data[0];
          loadCommune({
            code: c.code,
            nom: c.nom,
            lat: c.centre.coordinates[1],
            lon: c.centre.coordinates[0]
          });
        } else {
          showToast("Commune non trouvée");
        }
      } catch (e) {
        showToast("Erreur de recherche");
      }
    }

    document.getElementById("btnGeo").addEventListener("click", () => {
      if (!navigator.geolocation) {
        showToast("Géolocalisation non supportée");
        return;
      }
      showToast("Localisation…");
      navigator.geolocation.getCurrentPosition(
        pos => searchByCoords(pos.coords.latitude, pos.coords.longitude),
        () => showToast("Impossible d'obtenir la position")
      );
    });

    async function searchByCoords(lat, lon) {
      try {
        const url = `https://geo.api.gouv.fr/communes?lat=${lat}&lon=${lon}&fields=nom,code,centre`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.length) {
          const c = data[0];
          loadCommune({
            code: c.code,
            nom: c.nom,
            lat: c.centre?.coordinates[1] || lat,
            lon: c.centre?.coordinates[0] || lon
          });
        } else {
          showToast("Aucune commune trouvée à cet endroit");
        }
      } catch (e) {
        showToast("Erreur de géocodage");
      }
    }

    // ========== Chargement des analyses ==========
    async function loadCommune(commune) {
      currentCommune = commune;
      selectedDate = document.getElementById("dateInput").value || new Date().toISOString().slice(0, 10);

      document.getElementById("communeInfo").innerHTML =
        `<strong>${commune.nom}</strong> (${commune.code}) — analyses autour du ${formatDate(selectedDate)}`;

      document.getElementById("list").innerHTML = `<div class="loading">Chargement des analyses…</div>`;
      markersLayer.clearLayers();
      allPrelevements = [];

      // Fenêtre de dates : ± 180 jours autour de la date choisie
      const target = new Date(selectedDate);
      const minD = new Date(target);
      minD.setDate(minD.getDate() - 180);
      const maxD = new Date(target);
      maxD.setDate(maxD.getDate() + 60);

      const dateMin = minD.toISOString().slice(0, 10);
      const dateMax = maxD.toISOString().slice(0, 10);

      try {
        const url = `https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=${commune.code}&date_min_prelevement=${dateMin}&date_max_prelevement=${dateMax}&size=20000`;
        const res = await fetch(url);
        const json = await res.json();
        const rows = json.data || [];

        if (rows.length === 0) {
          // Fallback : dernière année disponible
          const url2 = `https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=${commune.code}&size=5000`;
          const res2 = await fetch(url2);
          const json2 = await res2.json();
          processResults(json2.data || [], commune, target);
        } else {
          processResults(rows, commune, target);
        }
      } catch (err) {
        document.getElementById("list").innerHTML = `<div class="empty">Erreur de chargement des données</div>`;
        showToast("Erreur API Hub'Eau");
      }
    }

    function processResults(rows, commune, targetDate) {
      // Grouper par code_prelevement
      const mapPrelev = new Map();
      rows.forEach(r => {
        const code = r.code_prelevement;
        if (!mapPrelev.has(code)) {
          mapPrelev.set(code, {
            code,
            date: r.date_prelevement,
            conclusion: r.conclusion_conformite_prelevement || "",
            distributeur: r.nom_distributeur || r.nom_uge || "—",
            commune: r.nom_commune || commune.nom,
            params: []
          });
        }
        mapPrelev.get(code).params.push({
          libelle: r.libelle_parametre || r.libelle_parametre_web || r.code_parametre,
          resultat: r.resultat_alphanumerique || (r.resultat_numerique != null ? r.resultat_numerique + " " + (r.libelle_unite || "") : "—"),
          limite: r.limite_qualite_parametre,
          reference: r.reference_qualite_parametre
        });
      });

      allPrelevements = Array.from(mapPrelev.values());

      // Trier par proximité de date
      allPrelevements.sort((a, b) => {
        const da = Math.abs(new Date(a.date) - targetDate);
        const db = Math.abs(new Date(b.date) - targetDate);
        return da - db;
      });

      renderList();
      updateMapMarkers(commune);
      map.setView([commune.lat, commune.lon], 12);
    }

    // ========== Filtres ==========
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderList();
        if (currentCommune) updateMapMarkers(currentCommune);
      });
    });

    function getFiltered() {
      if (currentFilter === "all") return allPrelevements;
      return allPrelevements.filter(p => {
        const conf = isConforme(p);
        if (currentFilter === "conforme") return conf === true;
        if (currentFilter === "nonconforme") return conf === false;
        return true;
      });
    }

    function renderList() {
      const list = getFiltered();
      const container = document.getElementById("list");
      if (!list.length) {
        container.innerHTML = `<div class="empty">Aucun prélèvement pour ce filtre</div>`;
        return;
      }
      container.innerHTML = list.map((p, i) => {
        const conf = isConforme(p);
        const badgeClass = conf === true ? "ok" : conf === false ? "ko" : "unk";
        const badgeText = conf === true ? "Conforme" : conf === false ? "Non conforme" : "—";
        return `
          <div class="card" data-idx="${i}">
            <div class="card-header">
              <div class="card-date">${formatDate(p.date)}</div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="card-meta">${p.distributeur}</div>
            <div class="card-meta">${p.params.length} paramètre(s)</div>
          </div>
        `;
      }).join("");

      container.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => {
          const idx = parseInt(card.dataset.idx);
          openDetail(list[idx]);
        });
      });
    }

    function formatDate(d) {
      if (!d) return "—";
      const dt = new Date(d);
      return dt.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
    }

    // ========== Carte markers ==========
    function updateMapMarkers(commune) {
      markersLayer.clearLayers();
      const list = getFiltered();
      list.forEach((p, i) => {
        const [lat, lon] = jitter(commune.lat, commune.lon, i);
        const conf = isConforme(p);
        const color = conf === true ? "#22c55e" : conf === false ? "#ef4444" : "#94a3b8";
        const icon = L.divIcon({
          className: "",
          html: `<div class="marker-icon" style="background:${color}"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });
        const m = L.marker([lat, lon], { icon });
        m.bindPopup(`<strong>${formatDate(p.date)}</strong><br>${p.distributeur}<br><em>${conf === true ? "Conforme" : conf === false ? "Non conforme" : "—"}</em>`);
        m.on("click", () => openDetail(p));
        markersLayer.addLayer(m);
      });
    }

    // ========== Détail ==========
    function openDetail(p) {
      const conf = isConforme(p);
      document.getElementById("detailTitle").textContent = `Prélèvement du ${formatDate(p.date)}`;
      let html = `
        <div class="detail-section">
          <h3>Informations</h3>
          <p><strong>Commune :</strong> ${p.commune}</p>
          <p><strong>Distributeur :</strong> ${p.distributeur}</p>
          <p><strong>Conclusion :</strong> ${p.conclusion || "—"}</p>
          <p><strong>Conformité :</strong> ${conf === true ? "✅ Conforme" : conf === false ? "❌ Non conforme" : "—"}</p>
        </div>
        <div class="detail-section">
          <h3>Paramètres analysés (${p.params.length})</h3>
          <table>
            <thead><tr><th>Paramètre</th><th>Résultat</th></tr></thead>
            <tbody>
              ${p.params.map(par => `
                <tr>
                  <td>${par.libelle}</td>
                  <td>${par.resultat}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
      document.getElementById("detailBody").innerHTML = html;
      document.getElementById("detailPanel").classList.add("open");
    }

    document.getElementById("closeDetail").addEventListener("click", () => {
      document.getElementById("detailPanel").classList.remove("open");
    });

    // Changement de date → recharger si une commune est déjà sélectionnée
    document.getElementById("dateInput").addEventListener("change", () => {
      if (currentCommune) {
        loadCommune(currentCommune);
      }
    });
  </script>
</body>
